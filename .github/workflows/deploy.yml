name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Run accessibility tests
      run: |
        npm install -g axe-core-cli
        axe --exit --verbose index.html info.html contact.html studyguide.html

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build for production
      run: |
        # Minify CSS files
        npm install -g clean-css-cli
        cleancss -o style.min.css style.css
        cleancss -o index.min.css index.css
        cleancss -o contact.min.css contact.css
        cleancss -o studyguide.min.css studyguide.css
        cleancss -o info.min.css info.css

        # Minify JavaScript
        npm install -g uglify-js
        uglifyjs script.js -o script.min.js

        # Update HTML files to use minified assets
        sed -i 's/style.css/style.min.css/g' *.html
        sed -i 's/index.css/index.min.css/g' index.html
        sed -i 's/contact.css/contact.min.css/g' contact.html
        sed -i 's/studyguide.css/studyguide.min.css/g' studyguide.html
        sed -i 's/info.css/info.min.css/g' info.html
        sed -i 's/script.js/script.min.js/g' studyguide.html

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4